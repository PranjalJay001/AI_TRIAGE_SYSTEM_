[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-triage-system"
version = "0.1.0"
description = "AI Triage System for OpenEnv Hackathon"
readme = "README.md"
requires-python = ">=3.10"

# Sabse zaruri dependencies jo validator maang raha hai
dependencies = [
    "openenv-core>=0.2.0",
    "openenv>=0.2.0",
    "gradio",
    "pydantic",
]

# Ye section 'server entry point' wala error solve karega
[project.scripts]
server = "server.app:main"
